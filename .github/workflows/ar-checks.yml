name: AR checks
on:
  pull_request:
    paths: ['ar/**', 'supabase/**', 'tests/ar-v2.mjs', '.github/workflows/ar-checks.yml']
  push:
    branches: [main]
    paths: ['ar/**', 'supabase/**', 'tests/ar-v2.mjs', '.github/workflows/ar-checks.yml']
permissions:
  contents: read
jobs:
  ar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ar-v2.mjs
