<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR · Örnek kart</title><script src="config.js"></script><style>body{margin:0;padding:32px;font:16px system-ui;background:#f5f4ed;color:#172122;text-align:center}img{display:block;width:min(90%,850px);height:auto;margin:35px auto}p{max-width:600px;margin:20px auto;line-height:1.6}a{color:inherit}@media print{p,a{display:none}img{width:90%}}</style></head><body><h1>AR test kartı</h1><p>Bu kartı bilgisayarda açık tut veya yazdır. Telefonda AR sayfasını açıp kameranı kartın tamamına doğrult.</p><img id="poster" alt="MindAR resmi örnek hedef kartı"><p id="error" hidden>Görsel yüklenemedi. Bağlantını ve config.js içindeki poster adresini kontrol et.</p><a href="index.html">AR sayfasına dön</a><script>const img=document.querySelector('#poster');img.onerror=()=>document.querySelector('#error').hidden=false;img.src=AR_CONFIG.poster;</script></body></html>
