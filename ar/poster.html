<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salva AR · Poster</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script><style>body{font:16px system-ui;background:#f6f5ef;color:#182019;text-align:center;padding:25px;margin:0}img{max-width:95%;max-height:85vh;display:block;margin:auto}p{line-height:1.6}@media print{p{display:none}img{max-height:none;width:100%}}</style></head><body><p id="info">Poster yükleniyor…</p><img id="poster" hidden alt="AR posteri"><script>(async()=>{try{if(!window.supabase)throw Error('Bağlantı dosyaları yüklenemedi.');const id=new URLSearchParams(location.search).get('id');const db=supabase.createClient(SALVA.supabaseUrl,SALVA.supabaseKey);const {data,error}=await db.from('ar_projects').select('title,poster_url').eq('id',id).eq('state','published').single();if(error||!data)throw Error('Poster bulunamadı.');document.title=data.title;const img=document.getElementById('poster');img.onerror=()=>document.getElementById('info').textContent='Poster dosyası yüklenemedi.';img.src=data.poster_url;img.alt=data.title;img.hidden=false;document.getElementById('info').textContent='Bu posteri bilgisayarda açık tut veya yazdır. Telefonda çalışmanın AR bağlantısını aç.';}catch(e){document.getElementById('info').textContent=e.message;}})();</script></body></html>
